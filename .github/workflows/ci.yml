name: CI

on:
  push:
    branches:
      - main
      - release/**
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CI: "true"
  UI_HEADLESS: "1"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Build artifacts
        run: make build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/
          retention-days: 5

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Run tests
        run: uv run pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Run ruff check
        run: uv run ruff check .
      - name: Run ruff format
        run: uv run ruff format --check .
      - name: Run type check
        run: |
          uv run pyright || echo "::warning::Pyright found issues (soft fail for now)"

  security:
    name: security
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          mkdir gitleaks_temp
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz -C gitleaks_temp
          sudo mv gitleaks_temp/gitleaks /usr/local/bin/
          rm -rf gitleaks_temp gitleaks_8.30.0_linux_x64.tar.gz
          gitleaks version

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Security Check
        # Uses the same script as local `make security`
        # Scans only current files, ignores git history
        run: |
          rm -rf .git
          uv run python scripts/check_security.py
          uv tool run pip-audit . || echo "::warning::Pip audit found issues (soft fail for now)"

  artifacts:
    name: artifacts
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: success()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: List artifacts
        run: ls -R dist

  deploy-gate:
    name: deploy-gate
    runs-on: ubuntu-latest
    needs: artifacts
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::warning::GEMINI_API_KEY is missing via secrets."
          else
            echo "Secrets valid."
          fi
      - name: Deploy Placeholder
        run: echo "Deployment gate passed. Ready for deployment script."

  summary:
    name: summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - test
      - lint
      - security
      - artifacts
      - deploy-gate
    steps:
      - name: Summarize job results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          ARTIFACTS_RESULT: ${{ needs.artifacts.result }}
          DEPLOY_GATE_RESULT: ${{ needs['deploy-gate'].result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat <<'MD' >> "$GITHUB_STEP_SUMMARY"
          ## Job results
          | Job | Result | Run |
          | --- | ------ | --- |
          | build | ${BUILD_RESULT} | [logs](${RUN_URL}) |
          | test | ${TEST_RESULT} | [logs](${RUN_URL}) |
          | lint | ${LINT_RESULT} | [logs](${RUN_URL}) |
          | security | ${SECURITY_RESULT} | [logs](${RUN_URL}) |
          | artifacts | ${ARTIFACTS_RESULT} | [logs](${RUN_URL}) |
          | deploy-gate | ${DEPLOY_GATE_RESULT} | [logs](${RUN_URL}) |
          MD

          failures=0
          for name in build test lint security artifacts deploy-gate; do
            var_name=$(echo "${name}_RESULT" | tr '[:lower:]-' '[:upper:]_')
            result=${!var_name}
            if [ "$result" != "success" ]; then
              echo "Job ${name} result: ${result}"
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "One or more jobs did not succeed; see summary above."
            exit 1
          fi
